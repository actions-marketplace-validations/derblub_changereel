name: Wrong result or bug
description: A change it reports that is none, one it misses, or a crash.
labels: ["bug"]
body:
  - type: textarea
    id: command
    attributes:
      label: Command or workflow step
      render: console
      placeholder: $ changereel --base main --serve "npm run preview -- --port {port}"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The entry of changes.json that is wrong, what is missing from it, or the error message. And what you expected.
    validations:
      required: true
  - type: textarea
    id: page
    attributes:
      label: The page
      description: The two screenshots from out/shots, or two public addresses. Is the page the same on every visit?
  - type: input
    id: version
    attributes:
      label: changereel version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version, browser and operating system
      placeholder: Node 24, Chrome 141, ubuntu-latest
