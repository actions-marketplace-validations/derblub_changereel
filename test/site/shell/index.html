<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>App shell</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font: 17px/1.6 system-ui, sans-serif; }
  body { display: flex; }
  aside { width: 240px; background: #18181b; color: #fff; padding: 24px; box-sizing: border-box; }
  main { flex: 1; height: 100vh; overflow-y: auto; padding: 40px; box-sizing: border-box; }
  section { height: 600px; margin-bottom: 40px; background: #f4f4f5; padding: 24px; box-sizing: border-box; }
</style></head>
<body><aside>Sidebar</aside><main><section>One</section><section>Two</section><section id="last">Three</section></main></body>
</html>
